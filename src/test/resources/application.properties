# MockServer - dev services (Testcontainers) start automatically during tests
quarkus.mockserver.devservices.enabled=true

# REST clients pointed at the mock server
quarkus.rest-client.onecx_document_svc.url=http://localhost:${quarkus.mockserver.port}
quarkus.rest-client.onecx_file_storage_svc.url=http://localhost:${quarkus.mockserver.port}


